<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="InternTrack applications - add, edit, sort, search, filter and export internship applications">
  <meta name="author" content="Atinbaddie">
  <title>Applications | InternTrack</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
  <!-- Shared logic: login check, navbar, footer, dark mode -->
  <script src="js/main.js"></script>
</head>
<body class="d-flex flex-column min-vh-100" data-page="applications">

  <!-- Navbar is built by main.js -->
  <div id="navbar"></div>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container flex-grow-1 py-4">

    <!-- Page title and buttons -->
    <header class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h3 fw-bold">Applications</h1>
        <p class="text-muted mb-0">All your internship applications in one place</p>
      </div>
      <div class="d-flex gap-2">
        <button type="button" class="btn btn-outline-primary" id="exportBtn">
          <i class="bi bi-download me-1"></i>Export CSV
        </button>
        <button type="button" class="btn btn-primary" id="addBtn">
          <i class="bi bi-plus-circle me-1"></i>Add Application
        </button>
      </div>
    </header>

    <!-- Search and filter bar -->
    <section class="row g-2 mb-3" aria-label="Search and filter">
      <div class="col-12 col-md-8">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput"
                 placeholder="Search by company or position..." aria-label="Search applications">
        </div>
      </div>
      <div class="col-12 col-md-4">
        <select class="form-select" id="statusFilter" aria-label="Filter by status">
          <option value="All">All statuses</option>
          <option value="Applied">Applied</option>
          <option value="Interview">Interview</option>
          <option value="Offered">Offered</option>
          <option value="Rejected">Rejected</option>
        </select>
      </div>
    </section>

    <!-- Result count -->
    <p class="text-muted small mb-2" id="resultCount"></p>

    <!-- Applications table -->
    <section class="card table-card" aria-label="Applications table">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-head">
              <tr>
                <th scope="col" class="fw-semibold">#</th>
                <th scope="col">
                  <button type="button" class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" data-sort="company">
                    Company <i class="bi bi-arrow-down-up small"></i>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" data-sort="position">
                    Position <i class="bi bi-arrow-down-up small"></i>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" data-sort="dateApplied">
                    Date Applied <i class="bi bi-arrow-down-up small"></i>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" data-sort="deadline">
                    Deadline <i class="bi bi-arrow-down-up small"></i>
                  </button>
                </th>
                <th scope="col">
                  <button type="button" class="btn btn-link p-0 text-reset fw-semibold text-decoration-none" data-sort="status">
                    Status <i class="bi bi-arrow-down-up small"></i>
                  </button>
                </th>
                <th scope="col" class="fw-semibold">Action</th>
              </tr>
            </thead>
            <tbody id="applicationsBody">
              <!-- Rows are added by applications.js -->
            </tbody>
          </table>
        </div>

        <!-- Rows per page and page buttons -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
          <div class="d-flex align-items-center gap-2">
            <label for="pageSize" class="small text-muted mb-0">Rows per page</label>
            <select class="form-select form-select-sm w-auto" id="pageSize">
              <option value="5" selected>5</option>
              <option value="10">10</option>
              <option value="25">25</option>
            </select>
          </div>
          <nav id="paginationNav" aria-label="Applications pages"></nav>
        </div>
      </div>
    </section>
  </main>

  <!-- ========== ADD / EDIT APPLICATION MODAL ========== -->
  <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="addForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="addModalLabel">Add New Application</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label for="companyInput" class="form-label">Company</label>
              <input type="text" class="form-control" id="companyInput" placeholder="e.g. Google Malaysia" required>
              <div class="invalid-feedback">Please enter the company name.</div>
            </div>

            <div class="mb-3">
              <label for="positionInput" class="form-label">Position</label>
              <input type="text" class="form-control" id="positionInput" placeholder="e.g. Software Engineer Intern" required>
              <div class="invalid-feedback">Please enter the position.</div>
            </div>

            <div class="row">
              <div class="col-12 col-sm-6 mb-3">
                <label for="dateInput" class="form-label">Date Applied</label>
                <input type="date" class="form-control" id="dateInput" required>
                <div class="invalid-feedback">Please choose a date.</div>
              </div>

              <div class="col-12 col-sm-6 mb-3">
                <label for="deadlineInput" class="form-label">Deadline <span class="text-muted">(optional)</span></label>
                <input type="date" class="form-control" id="deadlineInput">
              </div>
            </div>

            <div class="mb-3">
              <label for="statusInput" class="form-label">Status</label>
              <select class="form-select" id="statusInput" required>
                <option value="Applied">Applied</option>
                <option value="Interview">Interview</option>
                <option value="Offered">Offered</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveBtn">Save Application</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer is built by main.js -->
  <div id="footer"></div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Sample data -->
  <script src="js/data.js"></script>
  <!-- Applications page logic -->
  <script src="js/applications.js"></script>
</body>
</html>
