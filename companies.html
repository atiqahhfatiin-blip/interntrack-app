<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="InternTrack companies - add, search and filter companies for internship applications">
  <meta name="author" content="Atinbaddie">
  <title>Companies | InternTrack</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="css/style.css" rel="stylesheet">
  <!-- Shared logic: login check, navbar, footer, dark mode -->
  <script src="js/main.js"></script>
</head>
<body class="d-flex flex-column min-vh-100" data-page="companies">

  <!-- Navbar is built by main.js -->
  <div id="navbar"></div>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="container flex-grow-1 py-4">

    <!-- Page title and Add button -->
    <header class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-4">
      <div>
        <h1 class="h3 fw-bold">Companies</h1>
        <p class="text-muted mb-0">Companies you are interested in for your internship</p>
      </div>
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCompanyModal">
        <i class="bi bi-plus-circle me-1"></i>Add Company
      </button>
    </header>

    <!-- Search and filter bar -->
    <section class="row g-2 mb-3" aria-label="Search and filter">
      <div class="col-12 col-md-8">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control" id="searchInput"
                 placeholder="Search by company name or industry..." aria-label="Search companies">
        </div>
      </div>
      <div class="col-12 col-md-4">
        <select class="form-select" id="locationFilter" aria-label="Filter by location">
          <option value="All">All locations</option>
          <!-- Location options are added by companies.js -->
        </select>
      </div>
    </section>

    <!-- Result count -->
    <p class="text-muted small mb-2" id="resultCount"></p>

    <!-- Company cards grid (filled by companies.js) -->
    <section class="row g-3" id="companiesGrid" aria-label="Companies list">
    </section>
  </main>

  <!-- ========== ADD COMPANY MODAL ========== -->
  <div class="modal fade" id="addCompanyModal" tabindex="-1" aria-labelledby="addCompanyLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="addCompanyForm" novalidate>
          <div class="modal-header">
            <h2 class="modal-title h5" id="addCompanyLabel">Add New Company</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <div class="modal-body">
            <div class="mb-3">
              <label for="nameInput" class="form-label">Company Name</label>
              <input type="text" class="form-control" id="nameInput" placeholder="e.g. Google Malaysia" required>
              <div class="invalid-feedback">Please enter the company name.</div>
            </div>

            <div class="mb-3">
              <label for="industryInput" class="form-label">Industry</label>
              <input type="text" class="form-control" id="industryInput" placeholder="e.g. Technology" required>
              <div class="invalid-feedback">Please enter the industry.</div>
            </div>

            <div class="mb-3">
              <label for="locationInput" class="form-label">Location</label>
              <input type="text" class="form-control" id="locationInput" list="locationList"
                     placeholder="e.g. Johor Bahru" required>
              <!-- Suggestions (filled by companies.js) -->
              <datalist id="locationList"></datalist>
              <div class="invalid-feedback">Please enter the location.</div>
            </div>

            <div class="mb-3">
              <label for="emailInput" class="form-label">HR Email</label>
              <input type="email" class="form-control" id="emailInput" placeholder="e.g. hr@company.example" required>
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Company</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Footer is built by main.js -->
  <div id="footer"></div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Sample data -->
  <script src="js/data.js"></script>
  <!-- Companies page logic -->
  <script src="js/companies.js"></script>
</body>
</html>
